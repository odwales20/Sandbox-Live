name: Update signage playlist
on:
  push:
    branches: [main]
    paths:
      - 'signage/**'
      - '.github/workflows/signage-playlist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate image list
        run: python3 scripts/build_signage_playlist.py
      - name: Commit playlist if changed
        run: |
          if ! git diff --quiet -- signage/images.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add signage/images.json
            git commit -m 'Update signage image playlist'
            git push
          fi
