name: Update signage playlist
on:
  push:
    branches: [main]
    paths:
      - 'signage/**'
      - '.github/workflows/signage-playlist.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate image list
        run: |
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('signage')
          files=sorted(x.name for x in p.iterdir() if x.is_file() and x.suffix.lower() in {'.png','.jpg','.jpeg','.webp','.gif'})
          (p/'images.json').write_text(json.dumps(files,indent=2)+'\n')
          print(files)
          PY
      - name: Commit playlist if changed
        run: |
          if ! git diff --quiet -- signage/images.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add signage/images.json
            git commit -m 'Update signage image playlist'
            git push
          fi
